<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RepoRun — AI-powered deployment for any GitHub repository. Paste a URL and deploy instantly.">
  <title>RepoRun — Deploy with AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ── Reset & Variables ── */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: rgba(255, 255, 255, 0.03);
      --bg-card-hover: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(99, 102, 241, 0.5);
      --text-primary: #f0f0f5;
      --text-secondary: #8b8b9e;
      --text-muted: #56566a;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --success: #22c55e;
      --error: #ef4444;
      --warning: #f59e0b;
      --gradient-start: #6366f1;
      --gradient-end: #a855f7;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
    }

    html { height: 100%; }

    body {
      min-height: 100vh;
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      padding: 2rem 0 4rem;
    }

    /* ── Animated gradient background mesh ── */
    body::before {
      content: '';
      position: fixed;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(168, 85, 247, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, rgba(59, 130, 246, 0.05) 0%, transparent 50%);
      animation: meshFloat 20s ease-in-out infinite;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes meshFloat {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(2%, -1%) rotate(1deg); }
      66% { transform: translate(-1%, 1%) rotate(-0.5deg); }
    }

    /* ── Grid overlay ── */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 60px 60px;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 780px;
      padding: 0 2rem;
    }

    /* ── Brand ── */
    .brand {
      text-align: center;
      margin-bottom: 3rem;
      margin-top: 2rem;
    }

    .brand-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px; height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
      margin-bottom: 1.25rem;
      box-shadow: 0 0 40px var(--accent-glow);
      animation: iconPulse 3s ease-in-out infinite;
    }

    @keyframes iconPulse {
      0%, 100% { box-shadow: 0 0 40px var(--accent-glow); }
      50% { box-shadow: 0 0 60px var(--accent-glow), 0 0 80px rgba(168, 85, 247, 0.1); }
    }

    .brand-icon svg { width: 32px; height: 32px; fill: white; }

    .brand h1 {
      font-size: 2rem; font-weight: 800; letter-spacing: -0.03em;
      background: linear-gradient(135deg, var(--text-primary), var(--text-secondary));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    .brand p { margin-top: 0.5rem; color: var(--text-secondary); font-size: 0.95rem; }

    /* ── Card ── */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: border-color 0.3s ease;
    }

    .card:hover { border-color: rgba(255, 255, 255, 0.12); }

    /* ── Input group ── */
    .input-group { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; }
    .input-group label {
      display: block; font-size: 0.8rem; font-weight: 600;
      color: var(--text-secondary); text-transform: uppercase;
      letter-spacing: 0.08em; margin-bottom: 0.6rem;
    }
    .input-wrapper { flex: 1; display: flex; flex-direction: column; }

    #repoUrl {
      width: 100%; padding: 0.85rem 1rem;
      background: var(--bg-secondary); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text-primary);
      font-family: var(--font-mono); font-size: 0.9rem; outline: none;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    #repoUrl::placeholder { color: var(--text-muted); }
    #repoUrl:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px var(--accent-glow); }

    /* ── Deploy button ── */
    #deployBtn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 0.5rem; align-self: flex-end;
      padding: 0.85rem 1.75rem;
      background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
      color: white; font-family: var(--font-sans); font-weight: 600; font-size: 0.9rem;
      border: none; border-radius: 10px; cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      white-space: nowrap; min-width: 170px;
    }
    #deployBtn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 30px var(--accent-glow); }
    #deployBtn:active:not(:disabled) { transform: translateY(0); }
    #deployBtn:disabled { opacity: 0.5; cursor: not-allowed; }
    #deployBtn .spinner {
      display: none; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3); border-top-color: white;
      border-radius: 50%; animation: spin 0.6s linear infinite;
    }
    #deployBtn.loading .spinner { display: block; }
    #deployBtn.loading .btn-text { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Logs ── */
    .logs-section { margin-top: 1.5rem; }
    .logs-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.6rem; }
    .logs-header span {
      font-size: 0.8rem; font-weight: 600; color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: 0.08em;
    }

    .status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-muted); transition: background 0.3s ease;
    }
    .status-dot.active { background: var(--success); box-shadow: 0 0 8px rgba(34,197,94,0.5); animation: dotPulse 1.5s ease-in-out infinite; }
    .status-dot.error { background: var(--error); box-shadow: 0 0 8px rgba(239,68,68,0.5); }

    @keyframes dotPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    #logsOutput {
      width: 100%; min-height: 100px; max-height: 180px;
      overflow-y: auto; padding: 1rem;
      background: var(--bg-secondary); border: 1px solid var(--border);
      border-radius: 10px; font-family: var(--font-mono);
      font-size: 0.82rem; line-height: 1.7; color: var(--text-secondary);
    }
    #logsOutput::-webkit-scrollbar { width: 4px; }
    #logsOutput::-webkit-scrollbar-track { background: transparent; }
    #logsOutput::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .log-entry { display: block; padding: 2px 0; }
    .log-entry .timestamp { color: var(--text-muted); margin-right: 0.5rem; }
    .log-entry.success { color: var(--success); }
    .log-entry.error { color: var(--error); }
    .log-entry.info { color: var(--accent-hover); }
    .log-entry.warn { color: var(--warning); }

    /* ── Results Panel ── */
    .results-panel { display: none; margin-top: 1.5rem; animation: fadeSlideIn 0.4s ease-out; }
    .results-panel.visible { display: block; }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-section { margin-bottom: 1.25rem; }
    .result-section:last-child { margin-bottom: 0; }

    .result-label {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.75rem; font-weight: 600; color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.5rem;
    }
    .result-label .icon { font-size: 0.9rem; }

    /* ── Build status banner ── */
    .build-banner {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 1rem 1.25rem; border-radius: 10px;
      font-weight: 600; font-size: 0.95rem;
      margin-bottom: 1.25rem;
    }
    .build-banner.success-banner {
      background: rgba(34, 197, 94, 0.08);
      border: 1px solid rgba(34, 197, 94, 0.25);
      color: var(--success);
    }
    .build-banner.failed-banner {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: var(--error);
    }
    .build-banner .banner-icon { font-size: 1.3rem; }
    .build-banner .banner-meta {
      font-weight: 400; font-size: 0.8rem; color: var(--text-secondary);
      margin-left: auto;
    }

    /* ── Stack Badge ── */
    .stack-badge {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.5rem 1rem;
      background: linear-gradient(135deg, rgba(99,102,241,0.12), rgba(168,85,247,0.08));
      border: 1px solid rgba(99,102,241,0.2);
      border-radius: 8px; font-family: var(--font-sans);
      font-size: 0.9rem; font-weight: 600; color: var(--accent-hover);
    }

    /* ── Env Tags ── */
    .env-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .env-tag {
      display: inline-block; padding: 0.3rem 0.65rem;
      background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.2);
      border-radius: 6px; font-family: var(--font-mono);
      font-size: 0.78rem; font-weight: 500; color: var(--warning);
    }
    .env-none { color: var(--text-muted); font-style: italic; font-size: 0.85rem; }

    /* ── Heal History ── */
    .heal-timeline { display: flex; flex-direction: column; gap: 0.75rem; }
    .heal-entry {
      padding: 0.85rem 1rem;
      background: rgba(245, 158, 11, 0.04);
      border: 1px solid rgba(245, 158, 11, 0.12);
      border-radius: 8px;
    }
    .heal-entry-header {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.78rem; font-weight: 600; color: var(--warning);
      margin-bottom: 0.4rem;
    }
    .heal-entry-reason {
      font-size: 0.82rem; line-height: 1.55; color: var(--text-secondary);
    }
    .heal-entry-error {
      margin-top: 0.4rem; padding: 0.5rem 0.7rem;
      background: rgba(0,0,0,0.3); border-radius: 6px;
      font-family: var(--font-mono); font-size: 0.72rem;
      line-height: 1.5; color: var(--error);
      max-height: 80px; overflow-y: auto;
    }

    /* ── Dockerfile Block ── */
    .dockerfile-block {
      position: relative;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 10px; overflow: hidden;
    }
    .dockerfile-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.6rem 1rem;
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid var(--border);
    }
    .dockerfile-header span { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); }
    .copy-btn {
      padding: 0.3rem 0.7rem;
      background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text-secondary);
      font-family: var(--font-sans); font-size: 0.72rem; font-weight: 500;
      cursor: pointer; transition: background 0.2s ease, color 0.2s ease;
    }
    .copy-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-primary); }
    .copy-btn.copied { color: var(--success); border-color: rgba(34,197,94,0.3); }
    .dockerfile-block pre { margin: 0; padding: 1rem; overflow-x: auto; }
    .dockerfile-block code {
      font-family: var(--font-mono); font-size: 0.8rem;
      line-height: 1.65; color: var(--text-primary); white-space: pre;
    }
    .dockerfile-block pre::-webkit-scrollbar { height: 4px; }
    .dockerfile-block pre::-webkit-scrollbar-track { background: transparent; }
    .dockerfile-block pre::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── Error block ── */
    .error-block {
      padding: 1rem;
      background: rgba(239, 68, 68, 0.05);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 10px;
      font-family: var(--font-mono);
      font-size: 0.78rem; line-height: 1.6;
      color: var(--error);
      max-height: 250px; overflow-y: auto;
      white-space: pre-wrap; word-break: break-word;
    }

    /* ── Build explanation ── */
    .build-explanation {
      padding: 0.85rem 1rem;
      background: rgba(34,197,94,0.04);
      border: 1px solid rgba(34,197,94,0.12);
      border-radius: 8px;
      font-size: 0.85rem; line-height: 1.6; color: var(--text-secondary);
    }

    /* ── Footer ── */
    .footer { text-align: center; margin-top: 2rem; font-size: 0.78rem; color: var(--text-muted); }
    .footer a { color: var(--text-secondary); text-decoration: none; transition: color 0.2s ease; }
    .footer a:hover { color: var(--accent-hover); }

    /* ── Responsive ── */
    @media (max-width: 520px) {
      .container { padding: 0 1.25rem; }
      .input-group { flex-direction: column; }
      #deployBtn { width: 100%; }
      .brand h1 { font-size: 1.6rem; }
      .card { padding: 1.5rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Brand -->
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
      </div>
      <h1>RepoRun</h1>
      <p>AI-powered deployment for any GitHub repository</p>
    </div>

    <!-- Card -->
    <div class="card">
      <div class="input-group">
        <div class="input-wrapper">
          <label for="repoUrl">Repository URL</label>
          <input
            type="url"
            id="repoUrl"
            placeholder="https://github.com/owner/repo"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
        <button id="deployBtn" type="button">
          <span class="spinner"></span>
          <span class="btn-text">⚡ Deploy with AI</span>
        </button>
      </div>

      <!-- Logs -->
      <div class="logs-section">
        <div class="logs-header">
          <div class="status-dot" id="statusDot"></div>
          <span>Status Logs</span>
        </div>
        <div id="logsOutput">
          <span class="log-entry info"><span class="timestamp">[ready]</span>Paste a GitHub URL and hit Deploy.</span>
        </div>
      </div>

      <!-- Results Panel -->
      <div class="results-panel" id="resultsPanel">
        <!-- Build Status Banner -->
        <div id="buildBanner" class="build-banner" style="display:none;"></div>

        <!-- Stack -->
        <div class="result-section">
          <div class="result-label"><span class="icon">🔍</span> Detected Stack</div>
          <div class="stack-badge" id="detectedStack"></div>
        </div>

        <!-- Required Envs -->
        <div class="result-section">
          <div class="result-label"><span class="icon">🔑</span> Required Environment Variables</div>
          <div class="env-tags" id="requiredEnvs"></div>
        </div>

        <!-- Self-Heal History (shown only when there were retries) -->
        <div class="result-section" id="healSection" style="display:none;">
          <div class="result-label"><span class="icon">🔧</span> Self-Heal History</div>
          <div class="heal-timeline" id="healTimeline"></div>
        </div>

        <!-- Dockerfile -->
        <div class="result-section">
          <div class="result-label"><span class="icon">🐳</span> Final Dockerfile</div>
          <div class="dockerfile-block">
            <div class="dockerfile-header">
              <span>Dockerfile</span>
              <button class="copy-btn" id="copyBtn">Copy</button>
            </div>
            <pre><code id="dockerfileCode"></code></pre>
          </div>
        </div>

        <!-- Error log (shown only on failure) -->
        <div class="result-section" id="errorSection" style="display:none;">
          <div class="result-label"><span class="icon">🚨</span> Last Build Error</div>
          <div class="error-block" id="errorBlock"></div>
        </div>

        <!-- Build Explanation -->
        <div class="result-section">
          <div class="result-label"><span class="icon">📋</span> Build Explanation</div>
          <div class="build-explanation" id="buildExplanation"></div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      Built with purpose · <a href="https://github.com/Shikhar-2005/RepoRun" target="_blank" rel="noopener">GitHub</a>
    </div>
  </div>

  <script>
    const repoInput = document.getElementById('repoUrl');
    const deployBtn = document.getElementById('deployBtn');
    const logsOutput = document.getElementById('logsOutput');
    const statusDot = document.getElementById('statusDot');
    const resultsPanel = document.getElementById('resultsPanel');
    const buildBanner = document.getElementById('buildBanner');
    const detectedStack = document.getElementById('detectedStack');
    const requiredEnvs = document.getElementById('requiredEnvs');
    const healSection = document.getElementById('healSection');
    const healTimeline = document.getElementById('healTimeline');
    const dockerfileCode = document.getElementById('dockerfileCode');
    const errorSection = document.getElementById('errorSection');
    const errorBlock = document.getElementById('errorBlock');
    const buildExplanation = document.getElementById('buildExplanation');
    const copyBtn = document.getElementById('copyBtn');

    let lastDockerfile = '';

    function ts() {
      return new Date().toLocaleTimeString('en-US', { hour12: false });
    }

    function escapeHtml(text) {
      const d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML;
    }

    function appendLog(message, type = '') {
      const entry = document.createElement('span');
      entry.className = `log-entry ${type}`;
      entry.innerHTML = `<span class="timestamp">[${ts()}]</span>${escapeHtml(message)}`;
      logsOutput.appendChild(document.createTextNode('\n'));
      logsOutput.appendChild(entry);
      logsOutput.scrollTop = logsOutput.scrollHeight;
    }

    function setLoading(loading) {
      deployBtn.disabled = loading;
      deployBtn.classList.toggle('loading', loading);
      statusDot.classList.toggle('active', loading);
    }

    function renderResults(data, status) {
      // ── Build banner ──
      buildBanner.style.display = 'flex';
      buildBanner.className = 'build-banner';
      if (status === 'success') {
        const healed = data.healHistory && data.healHistory.length > 0;
        buildBanner.classList.add('success-banner');
        buildBanner.innerHTML = `
          <span class="banner-icon">✅</span>
          <span>${healed ? 'Build Successful &amp; Self-Healed!' : 'Build Successful!'}</span>
          <span class="banner-meta">${data.attempts} attempt${data.attempts > 1 ? 's' : ''} · ${data.imageTag}</span>
        `;
      } else {
        buildBanner.classList.add('failed-banner');
        buildBanner.innerHTML = `
          <span class="banner-icon">❌</span>
          <span>Build Failed after ${data.attempts} attempt${data.attempts > 1 ? 's' : ''}</span>
          <span class="banner-meta">${data.imageTag}</span>
        `;
      }

      // ── Stack ──
      detectedStack.textContent = data.detected_stack;

      // ── Env vars ──
      requiredEnvs.innerHTML = '';
      if (data.required_envs && data.required_envs.length > 0) {
        data.required_envs.forEach(env => {
          const tag = document.createElement('span');
          tag.className = 'env-tag';
          tag.textContent = env;
          requiredEnvs.appendChild(tag);
        });
      } else {
        const none = document.createElement('span');
        none.className = 'env-none';
        none.textContent = 'No environment variables detected';
        requiredEnvs.appendChild(none);
      }

      // ── Self-Heal History ──
      if (data.healHistory && data.healHistory.length > 0) {
        healSection.style.display = 'block';
        healTimeline.innerHTML = '';
        data.healHistory.forEach((h, i) => {
          const el = document.createElement('div');
          el.className = 'heal-entry';
          el.innerHTML = `
            <div class="heal-entry-header">🔄 Attempt ${h.attempt} failed → Self-heal #${i + 1}</div>
            <div class="heal-entry-reason">${escapeHtml(h.reasoning)}</div>
            <div class="heal-entry-error">${escapeHtml(h.errorSnippet)}</div>
          `;
          healTimeline.appendChild(el);
        });
      } else {
        healSection.style.display = 'none';
      }

      // ── Dockerfile ──
      lastDockerfile = data.dockerfile;
      dockerfileCode.textContent = data.dockerfile;

      // ── Error log (only on failure) ──
      if (status !== 'success' && data.lastError) {
        errorSection.style.display = 'block';
        errorBlock.textContent = data.lastError;
      } else {
        errorSection.style.display = 'none';
      }

      // ── Build explanation ──
      buildExplanation.textContent = data.build_command_explanation;

      // ── Show panel ──
      resultsPanel.classList.remove('visible');
      void resultsPanel.offsetWidth;
      resultsPanel.classList.add('visible');
      resultsPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // Copy button
    copyBtn.addEventListener('click', async () => {
      if (!lastDockerfile) return;
      try {
        await navigator.clipboard.writeText(lastDockerfile);
        copyBtn.textContent = 'Copied!';
        copyBtn.classList.add('copied');
        setTimeout(() => { copyBtn.textContent = 'Copy'; copyBtn.classList.remove('copied'); }, 2000);
      } catch {
        const ta = document.createElement('textarea');
        ta.value = lastDockerfile;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        copyBtn.textContent = 'Copied!';
        copyBtn.classList.add('copied');
        setTimeout(() => { copyBtn.textContent = 'Copy'; copyBtn.classList.remove('copied'); }, 2000);
      }
    });

    deployBtn.addEventListener('click', async () => {
      const repoUrl = repoInput.value.trim();

      if (!repoUrl) {
        appendLog('Please enter a repository URL.', 'error');
        repoInput.focus();
        return;
      }

      const githubPattern = /^https?:\/\/(www\.)?github\.com\/[\w.-]+\/[\w.-]+/i;
      if (!githubPattern.test(repoUrl)) {
        appendLog('Invalid GitHub URL. Expected format: https://github.com/owner/repo', 'error');
        statusDot.classList.add('error');
        setTimeout(() => statusDot.classList.remove('error'), 2000);
        return;
      }

      // Reset
      resultsPanel.classList.remove('visible');
      buildBanner.style.display = 'none';
      errorSection.style.display = 'none';
      healSection.style.display = 'none';

      setLoading(true);
      appendLog(`Analyzing repository: ${repoUrl}`, 'info');
      appendLog('Fetching file tree and README from GitHub...', 'info');
      appendLog('Generating infrastructure with AI...', 'info');
      appendLog('Cloning repo & building Docker image — this may take a few minutes...', 'warn');

      try {
        const response = await fetch('/api/deploy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ repoUrl }),
        });

        const result = await response.json();

        if (response.ok && (result.status === 'success' || result.status === 'failed')) {
          const d = result.data;
          const isSuccess = result.status === 'success';

          appendLog(`Stack detected: ${d.detected_stack}`, 'info');

          if (d.healHistory && d.healHistory.length > 0) {
            d.healHistory.forEach((h, i) => {
              appendLog(`Self-heal #${i + 1}: ${h.reasoning}`, 'warn');
            });
          }

          if (isSuccess) {
            appendLog(`Build succeeded in ${d.attempts} attempt(s)! Image: ${d.imageTag}`, 'success');
            if (d.healHistory && d.healHistory.length > 0) {
              appendLog('Build Successful & Self-Healed!', 'success');
            }
          } else {
            appendLog(`Build failed after ${d.attempts} attempt(s).`, 'error');
          }

          renderResults(d, result.status);

          // Dot state
          statusDot.classList.remove('active', 'error');
          statusDot.classList.add(isSuccess ? 'active' : 'error');
          setTimeout(() => statusDot.classList.remove('active', 'error'), 5000);
        } else {
          appendLog(`Error: ${result.message || 'Unknown error'}`, 'error');
          statusDot.classList.add('error');
          setTimeout(() => statusDot.classList.remove('error'), 3000);
        }
      } catch (err) {
        appendLog(`Network error: ${err.message}`, 'error');
        statusDot.classList.add('error');
        setTimeout(() => statusDot.classList.remove('error'), 3000);
      } finally {
        setLoading(false);
      }
    });

    repoInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') deployBtn.click();
    });
  </script>

</body>
</html>
